<div class="consent" id="consent" role="dialog" aria-modal="false" aria-labelledby="consent-title" hidden>
  <div class="consent__inner">
    <div class="consent__text">
      <h2 id="consent-title">Sua privacidade</h2>
      <p>Usamos cookies para medir audiência e exibir anúncios. Nenhum script de terceiros é carregado antes do seu consentimento. Leia a <a href="/politica-de-cookies-br/">política de cookies</a>.</p>
    </div>
    <div class="consent__actions">
      <button type="button" class="btn btn--ghost" data-consent="denied">Recusar</button>
      <button type="button" class="btn btn--primary" data-consent="granted">Aceitar</button>
    </div>
  </div>
</div>
